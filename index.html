<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="theme-color" content="#0e0b14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>MIX3 v14</title>
<style>
  :root {
    /* JASNY MOTYW (domyślny) */
    --bg: #f4f3f7;
    --bg-elev: #ffffff;
    --bg-elev2: #f7f5fb;
    --bg-elev3: #ece8f2;
    --line: #e2ddec;
    --line2: #d0cbde;
    --text: #1a1626;
    --dim: #6b6280;
    --mute: #9b95a8;
    --purple: #7030A0;
    --purple-light: #a869d1;
    --red: #C00000;
    --green: #00B050;
    --amber: #d4a017;
    --hit-red: #dc2626;
    --step-amber: #b45309;
    --mono: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
    --row-hit: rgba(0, 176, 80, 0.06);
    --row-step: rgba(255, 191, 0, 0.06);
    --shadow: 0 8px 24px rgba(60, 40, 100, 0.15);
  }
  html[data-theme="dark"] {
    --bg: #0e0b14;
    --bg-elev: #171122;
    --bg-elev2: #201730;
    --bg-elev3: #2a1f3d;
    --line: #2a1f3d;
    --line2: #382a4d;
    --text: #ece7f4;
    --dim: #9b8fb3;
    --mute: #6b6280;
    --purple-light: #C9A6D9;
    --hit-red: #ef4444;
    --step-amber: #fbbf24;
    --row-hit: rgba(0, 176, 80, 0.05);
    --row-step: rgba(255, 230, 153, 0.04);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px; line-height: 1.35; overscroll-behavior: none;
    height: 100vh; height: 100dvh; overflow: hidden; }
  button, input { font-family: inherit; font-size: inherit; color: inherit; background: none; border: 0; }
  input { outline: none; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

  header { display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px 8px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  header .title { font-size: 13px; letter-spacing: 0.5px; color: var(--dim); font-weight: 500; }
  header .title b { color: var(--purple-light); font-weight: 700; margin: 0 2px; }
  header .menu { padding: 6px 10px; background: var(--bg-elev2); border: 1px solid var(--line);
    border-radius: 8px; font-size: 18px; color: var(--dim); }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    padding: 8px 14px 4px; flex-shrink: 0; }
  .tabs button { padding: 10px 8px; background: var(--bg-elev); border: 1px solid var(--line);
    border-left: 3px solid transparent; border-radius: 8px; color: var(--dim);
    font-weight: 700; font-size: 16px; display: flex; align-items: center;
    justify-content: center; gap: 8px; font-family: var(--mono); }
  .tabs button.active { background: var(--bg-elev2); color: var(--text); border-color: var(--purple);
    border-left-color: var(--purple); }
  .tabs button.active[data-tab="T2"] { border-color: var(--amber); border-left-color: var(--amber); }
  .tabs .badge { background: var(--bg-elev3); color: var(--dim); padding: 2px 8px;
    border-radius: 6px; font-size: 11px; font-weight: 600; }
  .tabs button.active .badge { background: var(--purple); color: #fff; }
  .tabs button.active[data-tab="T2"] .badge { background: var(--amber); color: #1a0f00; }

  .load-more { width: 100%; padding: 10px; background: var(--bg-elev2);
    border: 1px dashed var(--line2); border-radius: 6px; color: var(--dim);
    font-size: 12px; margin-bottom: 6px; cursor: pointer; }
  .load-more:active { background: var(--bg-elev3); }

  .chips { display: flex; gap: 6px; padding: 4px 14px 8px; overflow-x: auto;
    scrollbar-width: none; flex-shrink: 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 6px 10px 8px; background: var(--bg-elev); border: 1px solid var(--line);
    border-left: 3px solid var(--purple); border-radius: 8px; min-width: 82px;
    display: flex; flex-direction: column; align-items: center; gap: 1px; transition: background 120ms; }
  .chip.t2 { border-left-color: var(--amber); }
  .chip .n { font-family: var(--mono); font-weight: 700; font-size: 15px; }
  .chip .o { font-size: 10px; color: var(--dim); }
  .chip.active { background: var(--amber); border-color: var(--amber); }
  .chip.active .n, .chip.active .o { color: #1a0f00; }
  .chip.active .o { color: rgba(26,15,0,0.75); }

  .tiles { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 6px;
    padding: 0 14px 8px; flex-shrink: 0; }
  .tile { padding: 8px 10px; background: var(--bg-elev); border: 1px solid var(--line);
    border-left: 3px solid var(--line2); border-radius: 8px; min-height: 54px; }
  .tile .lbl { font-size: 10px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 2px; }
  .tile .val { font-family: var(--mono); font-size: 14px; font-weight: 600; line-height: 1.2; }
  .tile.base { border-left-color: var(--purple); }
  .tile.trig { border-left-color: var(--amber); }
  .tile.stats { border-left-color: var(--green); }
  .tile.trig.active { border-left-color: var(--red); background: color-mix(in srgb, var(--red) 10%, var(--bg-elev)); }

  .table-wrap { flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; background: var(--bg-elev); border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono);
    font-size: 12px; table-layout: fixed; }
  thead { position: sticky; top: 0; z-index: 2; background: var(--bg-elev2); }
  thead th { padding: 8px 4px; text-align: left; color: var(--dim);
    font-weight: 600; font-size: 11px; border-bottom: 1px solid var(--line);
    text-transform: uppercase; letter-spacing: 0.5px; }
  th:nth-child(1), td:nth-child(1) { width: 50px; padding-left: 8px; text-align: center; color: var(--mute); }
  th:nth-child(2), td:nth-child(2) { width: 44px; text-align: center; font-weight: 600; }
  th:nth-child(3), td:nth-child(3) { width: 72px; padding-left: 4px; }
  th:nth-child(4), td:nth-child(4) { width: 30px; text-align: center; }
  th:nth-child(5), td:nth-child(5) { padding: 6px; word-break: break-word; white-space: pre-line; }

  tbody tr { border-bottom: 1px solid var(--line); }
  tbody td { padding: 6px 4px; vertical-align: middle; }
  tr.HIT { background: var(--row-hit); }
  tr.STEP { background: var(--row-step); }
  tr.HIT td:nth-child(2) { color: var(--hit-red); font-weight: 700; }
  tr.STEP td:nth-child(2) { color: var(--step-amber); }
  tr.SKIP td:nth-child(2) { color: var(--text); }
  tr.win td:nth-child(3), tr.win td:nth-child(4) { color: var(--green); font-weight: 700; }
  tr.step-role td:nth-child(3) { color: var(--step-amber); }
  tr.krok td:nth-child(3) { color: var(--dim); }

  td.cell-label { line-height: 1.25; font-size: 11px; border-radius: 3px; }
  td.cell-label.start_gry   { background: #7030A0; color: #fff; font-weight: 700; }
  td.cell-label.game_hit    { background: #C9A6D9; color: #3B0F5E; }
  td.cell-label.game_step   { background: #C9A6D9; color: #3B0F5E; }
  td.cell-label.trigger     { background: #C00000; color: #fff; font-weight: 700; }
  td.cell-label.win_result  { background: #00B050; color: #fff; font-weight: 700; }
  td.cell-label.loss_result { background: #C00000; color: #fff; font-weight: 700; }
  td.cell-label.offset_close{ background: #C6EFCE; color: #006100; }
  td.cell-label.offset_hit  { background: #FFF9E0; color: #8B6B00; }
  td.cell-label.offset_step { background: #F2F2F2; color: #7F7F7F; }

  .empty { text-align: center; color: var(--mute); padding: 30px 14px; font-size: 13px; }

  .footer { display: flex; align-items: center; justify-content: space-between;
    padding: 6px 14px; font-size: 12px; color: var(--dim); flex-shrink: 0;
    background: var(--bg-elev); border-bottom: 1px solid var(--line); }
  .footer b { color: var(--text); font-family: var(--mono); }
  .footer .filter { padding: 4px 10px; border-radius: 6px; background: var(--bg-elev2);
    border: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .footer .filter.on { background: var(--purple); border-color: var(--purple); color: #fff; }

  .input-bar { display: grid; grid-template-columns: 52px 1fr 92px; gap: 8px;
    padding: 8px 12px 10px; background: var(--bg-elev); flex-shrink: 0;
    border-top: 1px solid var(--line); }
  .input-bar button, .input-bar input {
    height: 46px; border-radius: 10px; background: var(--bg-elev2); border: 1px solid var(--line);
    font-family: var(--mono); font-size: 18px; font-weight: 600; text-align: center;
    letter-spacing: 4px; color: var(--text); }
  .input-bar input::placeholder { color: var(--mute); font-weight: 400; letter-spacing: 6px; }
  .input-bar .undo { font-size: 22px; letter-spacing: 0; font-weight: 400; color: var(--dim); padding: 0; }
  .input-bar .undo:active { background: var(--bg-elev3); }
  .input-bar .add { background: var(--amber); border-color: var(--amber); color: #1a0f00;
    font-size: 15px; letter-spacing: 0.5px; }
  .input-bar .add:active { background: #b8860b; }

  .menu-panel { position: fixed; top: 56px; right: 12px; z-index: 30;
    background: var(--bg-elev2); border: 1px solid var(--line2); border-radius: 10px;
    padding: 6px; min-width: 220px; box-shadow: var(--shadow); display: none; }
  .menu-panel.open { display: block; }
  .menu-panel button { display: block; width: 100%; text-align: left; padding: 10px 12px;
    border-radius: 6px; font-size: 14px; color: var(--text); }
  .menu-panel button:active { background: var(--bg-elev3); }
  .menu-panel button.danger { color: var(--red); }
  .menu-panel hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

  #toast { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%);
    background: var(--bg-elev3); border: 1px solid var(--line2); border-radius: 8px;
    padding: 9px 14px; font-size: 13px; z-index: 100; opacity: 0; pointer-events: none;
    transition: opacity 180ms; max-width: calc(100% - 28px);
    box-shadow: var(--shadow); text-align: center; color: var(--text); }
  #toast.show { opacity: 1; }
  #toast.WIN { background: var(--green); color: #fff; border-color: var(--green); font-weight: 700; }
  #toast.LOSS { background: var(--red); color: #fff; border-color: var(--red); font-weight: 700; }
  #toast.TRIG { background: var(--purple); color: #fff; border-color: var(--purple); font-weight: 700; }
</style>
</head>

function buildMix3Cycles(codes){
  const cyc=[]; let inC=false,aEr=null,kr=[],lastS=false;
  for(let i=0;i<codes.length;i++){
    const c=codes[i],er=i+1,h=isHit(c),s=isStep(c);

    if(!inC){if(h){inC=true;aEr=er;kr=[];lastS=false;}continue;}
    if(s)lastS=true;
    else{if(lastS){kr.push(er);lastS=false;}
    else{cyc.push({anchor_er:aEr,win_er:er,M:kr.length+1,kroki_ers:kr.slice()});aEr=er;kr=[];lastS=false;}}

function detectOpenCycle(codes,cyc){
  let aEr;
  if(cyc.length)aEr=cyc[cyc.length-1].win_er;
  else{aEr=null;for(let i=0;i<codes.length;i++)if(isHit(codes[i])){aEr=i+1;break;}
    if(aEr===null)return null;}
  const kr=[];let ls=false;
  for(let i=aEr;i<codes.length;i++){
    if(isStep(codes[i]))ls=true;
    else if(isHit(codes[i])){if(ls){kr.push(i+1);ls=false;}}

  return{anchor_er:aEr,kroki_ers:kr,win_er:null,M:null};

function computeOffsetStats(cyc,TM,offset){
  let n=0,w=0,l=0,p=0;
  for(let t=0;t<cyc.length;t++){

    const gi=t+offset;if(gi>=cyc.length)continue;
    const M=cyc[gi].M;n++;
    if(M<=K_LIMIT){w++;p+=PNL_WIN[M];}else{l++;p+=PNL_LOSS;}
  }
  return{n,wins:w,losses:l,pnl:p};
}

function buildColumnLabels(TM,offset,cyc,codes,oc){
  const out=new Map();

    if(offset===1) add(twe,`▶ TRIGGER #${trigNo} T:${TM} !!START GRY!! Krok Gry 1/8`,'start_gry');
    else add(twe,`▶ TRIGGER #${trigNo} T:${TM} offset 1 Krok 1`,'trigger');

      const tI=tidx+J;
      if(tI<cyc.length){

          else if(isStep(co)){if(pr==='HIT')add(er,`offset ${J} k${ak} niezamkn.`,'offset_step');pr='STEP';}
        }
        if(J<offset-1) add(w,`offset ${J} zamkn. K${M} / offset ${J+1} k1`,'offset_close');
        else add(w,`offset ${J} zamkn. K${M} / OFFSET ${J+1} START GRY k1/8`,'start_gry');
        continue;
      }
      if(tI===cyc.length&&oc){
        const a=oc.anchor_er;let ak=1,pr='HIT';
        for(let er=a+1;er<=N;er++){
          const co=codes[er-1];
          if(isHit(co)){ak++;add(er,`[LIVE] offset ${J} k${ak}`,'offset_hit');pr='HIT';}
          else if(isStep(co)){if(pr==='HIT')add(er,`[LIVE] offset ${J} k${ak} niezamkn.`,'offset_step');pr='STEP';}
        }
        return;
      }
      return;

    const gi=tidx+offset;
    if(gi<cyc.length){
      const g=cyc[gi],ga=g.anchor_er,gw=g.win_er,gM=g.M;let ak=1,pr='HIT';
      for(let er=ga+1;er<gw;er++){

        if(isHit(co)){ak++;add(er,ak<=8?`Krok Gry ${ak}/8`:`poza k8 (M=${gM})`,'game_hit');pr='HIT';}

      return;

      const ga=oc.anchor_er;let ak=1,pr='HIT';
      for(let er=ga+1;er<=N;er++){
        const co=codes[er-1];
        if(isHit(co)){ak++;add(er,ak<=8?`[LIVE] Krok Gry ${ak}/8`:`[LIVE] poza k8`,'game_hit');pr='HIT';}

  for(let t=0;t<cyc.length;t++) if(cyc[t].M===TM) oneT(t);

}

const frozenHash = codes => md5(codes.map(c => c || '').join('|'));

function computeLastSafeEr(cyc, nCodes) {
  const mT1=Math.max(...T1_OFFSETS), mT2=Math.max(...T2_OFFSETS);
  let e = nCodes + 1;
  for (let t = 0; t < cyc.length; t++) {
    const c = cyc[t];

/* STAN */
const LS_CODES = 'mix3_v14_codes', LS_SESSION = 'mix3_v14_session', LS_MODEL = 'mix3_v14_model',
      LS_FILT = 'mix3_v14_filt', LS_SEEDED = 'mix3_v14_seeded', LS_TAB = 'mix3_v14_tab',
      LS_THEME = 'mix3_v14_theme';

const MODELS = [
  ...T1_OFFSETS.map(o => ({ TM: 1, off: o, key: `T1+${o}` })),
  ...T2_OFFSETS.map(o => ({ TM: 2, off: o, key: `T2+${o}` }))
];

const State = { codes: [], cycles: [], openCycle: null, sessionStartN: 0,
  model: 'T1+1', tab: 'T1', onlyEvents: false, showLast: 500 };

const encode = arr => arr.join('');
const decode = s => { const o = []; for (let i = 0; i + 3 <= s.length; i += 3) o.push(s.substr(i, 3)); return o; };
function save(){ localStorage.setItem(LS_CODES, encode(State.codes)); }
function load(){ const r = localStorage.getItem(LS_CODES); return r ? decode(r) : []; }

function trySeed() {
  if (localStorage.getItem(LS_SEEDED)) return;
  const raw = document.getElementById('seed').textContent.trim();
  if (!raw || raw.length < 300 || raw.length % 3 !== 0) return;
  State.codes = decode(raw);
  State.sessionStartN = State.codes.length;
  save();
  localStorage.setItem(LS_SESSION, String(State.sessionStartN));
  localStorage.setItem(LS_SEEDED, '1');
}

function recompute() {
  State.cycles = buildMix3Cycles(State.codes);
  State.openCycle = detectOpenCycle(State.codes, State.cycles);
}

/* AKCJE */
function addCode(code) {
  const c = toCode(code);
  if (!c || !/^\d{3}$/.test(c)) { toast('Zły kod', 'LOSS'); return false; }
  const prevN = State.cycles.length;
  State.codes.push(c);
  save(); recompute();
  const nowN = State.cycles.length;
  if (nowN > prevN) {
    for (let i = prevN; i < nowN; i++) {
      const cyc = State.cycles[i];
      const games = playedGamesAt(i);
      for (const g of games) {
        if (g.M <= K_LIMIT) toast(`WIN T${g.TM}+${g.offset} K:${g.M} · +${PNL_WIN[g.M]} zł`, 'WIN');
        else toast(`LOSS T${g.TM}+${g.offset} M=${g.M} · −1024 zł`, 'LOSS');
      }
      if (cyc.M === 1 || cyc.M === 2) {
        const cn = State.cycles.slice(0, i + 1).filter(x => x.M === cyc.M).length;
        toast(`⚡ TRIGGER T${cyc.M} #${cn}`, 'TRIG');
      }
    }
    vibrate([40, 60, 40]);
  } else vibrate([20]);
  render();
  return true;
}

function playedGamesAt(targetTidx) {
  const g = []; const cnt = { 1: 0, 2: 0 };
  for (let t = 0; t < State.cycles.length; t++) {
    const c = State.cycles[t];
    if (c.M !== 1 && c.M !== 2) continue;
    cnt[c.M]++;
    const offs = c.M === 1 ? T1_OFFSETS : T2_OFFSETS;
    for (const o of offs) if (t + o === targetTidx) g.push({ TM: c.M, trigNo: cnt[c.M], offset: o, M: State.cycles[targetTidx].M });
  }
  return g;
}

function undoCode() {
  if (!State.codes.length) return;
  State.codes.pop(); save(); recompute(); render();
}
function clearAll() {
  if (!confirm('Wyczyścić WSZYSTKIE kody? (nieodwracalne)')) return;
  State.codes = []; State.sessionStartN = 0;
  save(); localStorage.setItem(LS_SESSION, '0');
  recompute(); render();
}
function newSession() {
  State.sessionStartN = State.codes.length;
  localStorage.setItem(LS_SESSION, String(State.sessionStartN));
  toast('Nowa sesja rozpoczęta', 'TRIG'); render();
}

function exportState() {
  const lse = computeLastSafeEr(State.cycles, State.codes.length);
  const st = {
    version: VERSION, app_version: APP_VERSION,
    n_codes: State.codes.length, n_cycles: State.cycles.length,
    cycles: State.cycles, open_cycle: State.openCycle,
    codes: State.codes, sessions: [],
    last_safe_er: lse,
    frozen_hash: frozenHash(State.codes.slice(0, lse)),
    trigger_counts: {
      T1: State.cycles.filter(c => c.M === 1).length,
      T2: State.cycles.filter(c => c.M === 2).length
    }
  };
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  download(`state_mix3_v14_${State.codes.length}_${ts}.json`, JSON.stringify(st, null, 2), 'application/json');
  toast('State wyeksportowany');
}
function exportCsv() {
  const ts = new Date().toISOString().slice(0, 10);
  download(`mix3_codes_${State.codes.length}_${ts}.csv`, State.codes.join('\n'), 'text/csv');
  toast(`CSV: ${State.codes.length} kodów`);
}
function download(name, content, type) {
  const b = new Blob([content], { type });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
}
function importFile() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,.csv,.txt';
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => importText(String(r.result), f.name);
    r.readAsText(f);
  };
  inp.click();
}
function importText(text, filename) {
  let codes = null;
  if (filename.endsWith('.json')) {
    try {
      const p = JSON.parse(text);
      if (p.codes && Array.isArray(p.codes)) codes = p.codes.map(toCode).filter(Boolean);
      else if (Array.isArray(p)) codes = p.map(toCode).filter(Boolean);
    } catch (e) { toast('Błąd JSON', 'LOSS'); return; }
  } else {
    codes = text.split(/[\r\n,;]+/).map(s => s.trim()).filter(Boolean).map(toCode).filter(Boolean);
  }
  if (!codes || !codes.length) { toast('Brak kodów w pliku', 'LOSS'); return; }
  if (!confirm(`Wczytać ${codes.length} kodów? Zastąpi obecny ciąg (${State.codes.length}).`)) return;
  State.codes = codes; State.sessionStartN = codes.length;
  save(); localStorage.setItem(LS_SESSION, String(codes.length));
  recompute(); render();
  toast(`Wczytano ${codes.length}`);
}

/* RENDER */
function toast(msg, kind = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = kind ? kind + ' show' : 'show';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.className = kind, 3200);
}
function vibrate(pat) { try { navigator.vibrate && navigator.vibrate(pat); } catch {} }

function currentModel() { return MODELS.find(m => m.key === State.model) || MODELS[0]; }

function buildErMeta() {
  const winM = new Map(), kroki = new Set();
  for (const c of State.cycles) { winM.set(c.win_er, c.M); for (const k of c.kroki_ers) kroki.add(k); }
  return { winM, kroki };
}

function renderChips() {
  // filtruj po aktywnej zakładce T1/T2
  const c = document.getElementById('chips');
  const wantTM = State.tab === 'T1' ? 1 : 2;
  const visible = MODELS.filter(m => m.TM === wantTM);
  c.innerHTML = visible.map(m => {
    const s = computeOffsetStats(State.cycles, m.TM, m.off);
    return `<button class="chip ${m.TM===2?'t2':''} ${m.key===State.model?'active':''}" data-model="${m.key}">
      <span class="n">T${m.TM}+${m.off}</span>
      <span class="o">n:${s.n} · ${s.n?((s.wins/s.n*100).toFixed(0)+'%'):'–'}</span>
    </button>`;
  }).join('');
  c.querySelectorAll('.chip').forEach(b => {
    b.onclick = () => { State.model = b.dataset.model; localStorage.setItem(LS_MODEL, State.model); render(); };
  });
  const act = c.querySelector('.chip.active');
  if (act) act.scrollIntoView({ inline: 'center', block: 'nearest' });

  // update badges w zakładkach
  document.getElementById('badge-T1').textContent = T1_OFFSETS.length;
  document.getElementById('badge-T2').textContent = T2_OFFSETS.length;
  document.querySelectorAll('.tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === State.tab);
  });
}

function renderTiles() {
  const m = currentModel();
  const oc = State.openCycle;
  let baseTxt;
  if (!oc) baseTxt = 'szukam anchor';
  else {
    const nk = oc.kroki_ers.length;
    const po = State.codes.length - oc.anchor_er;
    baseTxt = `Nr ${oc.anchor_er} · K=${nk} · +${po}k`;
  }
  document.getElementById('tile-base').textContent = baseTxt;

  const trigWrap = document.getElementById('tile-trig-wrap');
  const trigEl = document.getElementById('tile-trig');
  const trigLbl = document.getElementById('tile-trig-lbl');
  const openIdx = State.cycles.length;
  let activeTrig = null;
  if (oc) {
    let cnt = 0;
    for (let t = 0; t < State.cycles.length; t++) {
      const cyc = State.cycles[t];
      if (cyc.M !== m.TM) continue;
      cnt++;
      if (t + m.off === openIdx) {
        let ak = 1;
        for (let i = oc.anchor_er; i < State.codes.length; i++) if (isHit(State.codes[i])) ak++;
        activeTrig = { trigNo: cnt, phase: 'GRA', ak, stake: ak <= 8 ? K_STAKES[ak-1] : null };
      } else {
        for (let J = 1; J < m.off; J++) {
          if (t + J === openIdx) {
            let ak = 1;
            for (let i = oc.anchor_er; i < State.codes.length; i++) if (isHit(State.codes[i])) ak++;
            activeTrig = { trigNo: cnt, phase: `PREP J=${J}`, ak, stake: null };
          }
        }
      }
    }
  }
  trigLbl.textContent = `Trigger · ${m.key}`;
  if (activeTrig) {
    trigWrap.classList.add('active');
    trigEl.textContent = activeTrig.phase === 'GRA'
      ? `#${activeTrig.trigNo} · GRA ${activeTrig.ak}/8` + (activeTrig.stake ? ` · ${activeTrig.stake}zł` : '')
      : `#${activeTrig.trigNo} · ${activeTrig.phase} k${activeTrig.ak}`;
  } else {
    trigWrap.classList.remove('active');
    trigEl.textContent = 'brak aktywnego';
  }

  const st = computeOffsetStats(State.cycles, m.TM, m.off);
  document.getElementById('tile-stats-lbl').textContent = `Wyniki · ${m.key}`;
  const wr = st.n ? (st.wins / st.n * 100).toFixed(1) : '0.0';
  const ps = st.pnl >= 0 ? '+' : '';
  document.getElementById('tile-stats').textContent = `${st.n} · ${wr}% · ${ps}${st.pnl}zł`;

  document.getElementById('th-col').textContent = m.key;
  document.getElementById('n-codes').textContent = State.codes.length;
  document.getElementById('n-cycles').textContent = State.cycles.length;
  const total = MODELS.reduce((a, mm) => a + computeOffsetStats(State.cycles, mm.TM, mm.off).pnl, 0);
  const p = document.getElementById('pnl');
  p.textContent = (total >= 0 ? '+' : '') + total + 'zł';
  p.style.color = total > 0 ? 'var(--green)' : total < 0 ? 'var(--red)' : '';
}

function renderTable() {
  const m = currentModel();
  const labels = buildColumnLabels(m.TM, m.off, State.cycles, State.codes, State.openCycle);
  const { winM, kroki } = buildErMeta();
  const N = State.codes.length;
  const rows = document.getElementById('rows');

  if (!N) {
    rows.innerHTML = `<tr><td colspan="5"><div class="empty">Brak kodów. Wpisz pierwszy poniżej.</div></td></tr>`;
    return;
  }

  const from = Math.max(0, N - State.showLast);
  const prio = { loss_result: 1, win_result: 2, start_gry: 3, game_hit: 4, game_step: 4,
    trigger: 5, offset_close: 6, offset_hit: 7, offset_step: 8 };

  const parts = [];
  if (from > 0) {
    parts.push(`<tr><td colspan="5"><button class="load-more" id="load-more">▲ Pokaż wcześniejsze +1000 (pozostało ${from})</button></td></tr>`);
  }
  for (let i = from; i < N; i++) {
    const er = i + 1, code = State.codes[i];
    const roleBase = isHit(code) ? 'HIT' : isStep(code) ? 'STEP' : 'SKIP';
    const isWin = winM.has(er);
    const isKrok = kroki.has(er);
    const M = winM.get(er);

    let roleTxt, extraCls = '';
    if (isHit(code)) {
      if (isWin && isKrok) { roleTxt = '✓ WIN+krok'; extraCls = 'win'; }
      else if (isWin) { roleTxt = '✓ WIN'; extraCls = 'win'; }
      else if (isKrok) { roleTxt = 'krok'; extraCls = 'krok'; }
      else { roleTxt = 'HIT'; }
    } else if (isStep(code)) {
      roleTxt = 'STEP'; extraCls = 'step-role';
    } else {
      roleTxt = 'SKIP';
    }

    const items = labels.get(er) || [];
    if (State.onlyEvents && roleBase === 'SKIP' && !items.length) continue;

    let cellCls = '', cellTxt = '';
    if (items.length) {
      const top = items.reduce((a, x) => prio[x.kind] < prio[a.kind] ? x : a);
      cellCls = top.kind;
      cellTxt = items.map(x => x.label).join('\n');
    }

    parts.push(`<tr class="${roleBase} ${extraCls}">
      <td>${er}</td>
      <td>${code}</td>
      <td>${roleTxt}</td>
      <td>${M != null ? M : ''}</td>
      <td class="${items.length ? 'cell-label ' + cellCls : ''}">${cellTxt}</td>
    </tr>`);
  }

  rows.innerHTML = parts.join('');
  const lm = document.getElementById('load-more');
  if (lm) lm.onclick = () => {
    State.showLast += 1000;
    State._loadedMore = true;
    render();
  };
  // scroll na dół tylko przy pierwszym renderze / dodaniu kodu, nie przy load-more
  if (!State._loadedMore) {
    const w = document.getElementById('tbl-wrap');
    w.scrollTop = w.scrollHeight;
  }
  State._loadedMore = false;
}

function render() {
  renderChips(); renderTiles(); renderTable();
  document.getElementById('filt').classList.toggle('on', State.onlyEvents);
}

/* BINDING */
function bindInput() {
  const inp = document.getElementById('code');
  const btnAdd = document.getElementById('add');
  const btnUndo = document.getElementById('undo');

  const commit = () => {
    let v = inp.value.trim();
    if (!v) return;
    if (!/^\d{1,3}$/.test(v)) { toast('Cyfry 0-9', 'LOSS'); return; }
    v = v.padStart(3, '0');
    if (addCode(v)) inp.value = '';
  };
  btnAdd.onclick = commit;
  btnUndo.onclick = undoCode;
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
  });
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g, '').slice(0, 3);
    if (inp.value.length === 3) commit();
  });

  document.getElementById('filt').onclick = () => {
    State.onlyEvents = !State.onlyEvents;
    localStorage.setItem(LS_FILT, State.onlyEvents ? '1' : '');
    render();
  };
}

function bindTabs() {
  document.querySelectorAll('.tabs button').forEach(b => {
    b.onclick = () => {
      State.tab = b.dataset.tab;
      localStorage.setItem(LS_TAB, State.tab);
      // jeśli aktywny model nie należy do wybranej zakładki — pierwszy z zakładki
      const wantTM = State.tab === 'T1' ? 1 : 2;
      if (!State.model.startsWith(State.tab)) {
        State.model = State.tab === 'T1' ? 'T1+1' : 'T2+2';
        localStorage.setItem(LS_MODEL, State.model);
      }
      render();
    };
  });
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const lbl = document.getElementById('theme-lbl');
  if (lbl) lbl.textContent = theme === 'dark' ? '☀ Jasny motyw' : '☾ Ciemny motyw';
  // meta theme-color dla status baru Androida
  const meta = document.querySelector('meta[name="theme-color"]:not([media])');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e0b14' : '#f4f3f7');
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem(LS_THEME, next);
  applyTheme(next);
}

function bindMenu() {
  const btn = document.getElementById('btn-menu');
  const panel = document.getElementById('menu-panel');
  btn.onclick = e => { e.stopPropagation(); panel.classList.toggle('open'); };
  document.addEventListener('click', e => {
    if (!panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
  });
  panel.querySelectorAll('button[data-act]').forEach(b => {
    b.onclick = () => {
      panel.classList.remove('open');
      const a = b.dataset.act;
      if (a === 'theme') toggleTheme();
      else if (a === 'session') newSession();
      else if (a === 'export-json') exportState();
      else if (a === 'export-csv') exportCsv();
      else if (a === 'import') importFile();
      else if (a === 'clear') clearAll();
    };
  });
}

async function init() {
  if (navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch {} }
  // motyw: domyślnie jasny, chyba że user wybrał ciemny
  applyTheme(localStorage.getItem(LS_THEME) === 'dark' ? 'dark' : 'light');
  // Kolejność: NAJPIERW load z localStorage, potem seed jako fallback jeśli pusto.
  // Poprzednia wersja miała odwrotną kolejność + zbugowany warunek — stąd pusta tabela.
  State.codes = load();
  trySeed();
  const sst = localStorage.getItem(LS_SESSION);
  State.sessionStartN = sst != null ? Number(sst) : State.codes.length;
  State.model = localStorage.getItem(LS_MODEL) || 'T1+1';
  State.tab = localStorage.getItem(LS_TAB) || 'T1';
  State.onlyEvents = !!localStorage.getItem(LS_FILT);
  // sanity: model musi pasować do zakładki
  if (!State.model.startsWith(State.tab)) State.model = State.tab === 'T1' ? 'T1+1' : 'T2+2';
  recompute(); bindTabs(); bindInput(); bindMenu(); render();
}
init();
</script>
